<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Saved Tasks</title>
  <script type="module" src="task.js" defer></script>

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-100 min-h-screen flex flex-col items-center p-6">

  <h1 class="text-3xl font-bold text-blue-600 mb-6">All Saved Tasks</h1>

  <div class="w-full max-w-md mb-6">
    <label for="search" class="block font-medium mb-2">Search</label>
    <input 
      type="text" 
      id="search" 
      class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
      placeholder="Search tasks..."
    >
  </div>
  
  <ul id="taskDisplay" class="w-full max-w-md space-y-3"></ul>

  <a href="index.html" class="mt-8 text-blue-500 hover:underline">← Back to Add Task</a>

</body>
</html>
